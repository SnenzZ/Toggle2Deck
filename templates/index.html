<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Notion to Anki</title>

        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='style.css') }}"
        />
        <link
            rel="icon"
            type="image/svg+xml"
            href="{{ url_for('static', filename='flavicon.svg') }}"
        />
    </head>
    <body>
        <main>
            <section class="tool" aria-labelledby="title">
                <header class="tool-header">
                    <p class="eyebrow">Notion Export Converter</p>
                    <h1 id="title">Notion to Anki</h1>
                    <p class="intro">
                        Upload your Notion HTML export as a ZIP and create an
                        Anki deck from it.
                    </p>
                </header>

                <form
                    action="/convert"
                    method="post"
                    enctype="multipart/form-data"
                >
                    <input
                        id="fileInput"
                        name="zip_file"
                        type="file"
                        accept=".zip,application/zip"
                        hidden
                        required
                    />

                    <div id="uploadZone" class="upload-zone">
                        <div class="upload-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <path
                                    d="M12 3v11m0-11 4 4m-4-4-4 4M5 14v4a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-4"
                                />
                            </svg>
                        </div>

                        <div class="upload-text">Upload ZIP</div>

                        <div class="upload-hint">
                            Click or drag ZIP file here
                        </div>
                    </div>

                    <div id="fileListContainer" class="file-list hidden">
                        <div class="file-list-header">
                            <span id="fileCount" class="file-count"></span>

                            <button
                                type="button"
                                id="clearAll"
                                class="clear-all"
                            >
                                Delete
                            </button>
                        </div>

                        <div id="fileList"></div>
                    </div>

                    <label>
                        Deck Name
                        <input
                            name="deck_name"
                            type="text"
                            placeholder="Import titles from Notion"
                        />
                    </label>

                    {% if error %}
                    <p class="error" role="alert">{{ error }}</p>
                    {% endif %}

                    <div class="actions">
                        <button type="submit">Create APKG</button>
                    </div>
                </form>

                <footer>
                    Expected is a ZIP file with exactly one Notion HTML file and
                    the associated media folder.
                </footer>
            </section>
        </main>
        <script src="{{ url_for('static', filename='app.js') }}"></script>
    </body>
</html>
